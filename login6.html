<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>own_login</title>

<style>
    #message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}
    .remember{
        display: flex;
        align-items: center;
        gap:8px;
    }
    a{
        color: darkcyan;
        text-decoration: none;
    }
    a:hover{
        text-decoration: underline;
        color: black;
    }
    input:focus{
        border: 1px solid gray;
        outline: none;
} 
    *{
        box-sizing:border-box;
    }
    body{
        background-color: #f2f2f2;
        justify-content: center;
        display: flex;
        align-items: center;
        min-height: 100vh;
    }
    h1{
        color: darkcyan;
        text-align: center;
    }
    .login-box{
        background-color: white;
        width: 350px;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px gray;
    }
    input[type="text"],input[type="password"] 
    
     {

        background-color: rgb(247, 250, 251);
        width:100%;
        padding: 10px;
        margin-top: 5px;
        border: 3px solid gray;
        border-radius: 4px;
     }
     button{
        width: 100%;
        padding: 5px;
        background-color: darkcyan;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        cursor: pointer;
        color: #f2f2f2;
     }
     button:hover{
        background-color:darkblue;
     }
</style>
</head>
<body>
    <div class="login-box">
    <h1> hello  </h1>
    <p> welcome to my website</p>
    <form id="loginForm" >
    <label for="username">USERNAME:</label>
    <input type="text" id="username" name="username" placeholder="enter name" required >
    <br><br>
    <label for="password" >PASSWORD:     </label>
    <input type="password" id="password" name="password" placeholder="enter password" required>
    <button type="button" id="showpassword">show</button>    <br><br>
    <div class="remember">
    <label for="remember">remember me</label>
    <input type="checkbox" id="remember">
    </div>
    <br><br>
    
    <button type="submit"> login</button>
    <p id="message"></p>
    </form>
    <br><br>
    <a href="#" >forgot password</a>
    <p class="register-text">
        Don't have an account?
        <a href="register.html"> create account</a>
    </p>
    </div>
   <script src="login.js"></script> 
</body>                      
</html>
