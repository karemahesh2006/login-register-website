<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f2f2f2;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .register-box {
            background-color: white;

            width: 400px;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px gray;
        }

        h1 {
            text-align: center;

            color: darkcyan;
        }

        p {
            text-align: center;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding: 10px;

            margin-top: 5px;

            border: 1px solid gray;

            border-radius: 5px;
        }

        input:focus {

            border: 2px solid darkcyan;

            outline: none;
        }

        button {

            width: 100%;

            padding: 12px;

            background-color: darkcyan;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background-color: darkblue;
        }

        a {

            color: darkcyan;

            text-decoration: none;
        }

        a:hover {

            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="register-box">

        <h1>Create Account</h1>

        <p>Register for my website</p>

        <form>

            <label for="name">
                Full Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <br><br>

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <label for="username">
                Username:
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Create username"
                required
            >

            <br><br>

            <label for="password">
                Password:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                required
            >

            <br><br>

            <label for="confirm-password">
                Confirm Password:
            </label>

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Re-enter password"
                required
            >

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?

            <a href="login6.html">
                Login
            </a>
        </p>

    </div>

</body>

</html>
